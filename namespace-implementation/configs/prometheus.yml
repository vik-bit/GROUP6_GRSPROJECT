# Prometheus configuration for namespace-based microservice benchmarking
# Scrapes node_exporter (system metrics) and process-exporter (per-service metrics)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Host system metrics (CPU, memory, disk, network)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          instance: 'host'

  # Per-process metrics for C microservice binaries
  - job_name: 'process_exporter'
    static_configs:
      - targets: ['localhost:9256']
        labels:
          instance: 'services'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
